[package]
name = "prompt-pocket"
version = "1.0.1"
description = "Local-first prompt manager"
authors = ["PromptPocket"]
edition = "2021"

[lib]
name = "prompt_pocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
